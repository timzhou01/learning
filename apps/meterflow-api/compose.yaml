
name: meterflow

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    ports:
      - "127.0.0.1:5434:5432"

    environment:
      POSTGRES_USER: meterflow
      POSTGRES_PASSWORD: meterflow_dev
      POSTGRES_DB: meterflow

    volumes:
      - meterflow_pgdata_v2:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterflow -d meterflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  
  gateway:
    build:
      context: ../..
      dockerfile: apps/meterflow-api/Dockerfile
    command: pnpm exec tsx src/index.ts
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment: &app-env
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://meterflow:meterflow_dev@postgres:5432/meterflow
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:29092
      AI_BASE_URL: http://localhost:9999
      AI_API_KEY: mock-only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  usage-consumer:
    build:
      context: ../..
      dockerfile: apps/meterflow-api/Dockerfile
    command: pnpm exec tsx src/usage-worker.ts
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  billing-worker:
    build:
      context: ../..
      dockerfile: apps/meterflow-api/Dockerfile
    command: pnpm exec tsx src/worker.ts
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy     
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/meterflow.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
volumes:
  meterflow_pgdata_v2:
  prometheus_data:
  grafana_data:
