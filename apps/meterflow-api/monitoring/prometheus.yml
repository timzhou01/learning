global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: meterflow-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3001

  - job_name: meterflow-usage-consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - usage-consumer:9464

  - job_name: meterflow-kafka
    static_configs:
      - targets:
          - kafka-exporter:9308